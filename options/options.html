<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SandBlock</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="page">

    <header class="hero">
      <svg class="logo" viewBox="0 0 96 96" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22d3ee"/>
            <stop offset="1" stop-color="#818cf8"/>
          </linearGradient>
        </defs>
        <path d="M48 4 L86 18 V46 C86 68 70 84 48 92 C26 84 10 68 10 46 V18 Z"
              fill="none" stroke="url(#lg)" stroke-width="7" stroke-linejoin="round"/>
        <circle cx="48" cy="48" r="17" fill="none" stroke="url(#lg)" stroke-width="7"/>
        <line x1="36" y1="60" x2="60" y2="36" stroke="url(#lg)" stroke-width="7" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Sand<em>Block</em></h1>
        <p data-i18n="opt_title"></p>
      </div>
    </header>

    <!-- Une seule application, deux documents. La navigation se fait dans
         le MÊME onglet : ouvrir un second onglet pour le mode concentration
         donnait l impression de deux produits séparés. -->
    <nav class="tabs">
      <a class="tab on" href="../options/options.html" data-i18n="settings"></a>
      <a class="tab" href="../focus/focus.html" data-i18n="opt_focus"></a>
    </nav>

    <section class="card">
      <h2 data-i18n="opt_general"></h2>
      <div class="row">
        <div class="row-text">
          <span class="row-title" data-i18n="opt_enable"></span>
          <span class="row-hint" data-i18n="opt_enable_hint"></span>
        </div>
        <label class="switch">
          <input type="checkbox" id="enabledToggle">
          <span class="slider"></span>
        </label>
      </div>
      <div class="row">
        <div class="row-text">
          <span class="row-title" data-i18n="opt_cosmetic"></span>
          <span class="row-hint" data-i18n="opt_cosmetic_hint"></span>
        </div>
        <label class="switch">
          <input type="checkbox" id="cosmeticToggle">
          <span class="slider"></span>
        </label>
      </div>
      <div class="row">
        <div class="row-text">
          <span class="row-title" data-i18n="opt_scriptlets"></span>
          <span class="row-hint" data-i18n="opt_scriptlets_hint"></span>
        </div>
        <label class="switch">
          <input type="checkbox" id="scriptletsToggle">
          <span class="slider"></span>
        </label>
      </div>
      <div class="row">
        <div class="row-text">
          <span class="row-title" data-i18n="opt_language"></span>
          <span class="row-hint" data-i18n="opt_language_hint"></span>
        </div>
        <select id="languageSelect" class="select"></select>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="opt_dash"></h2>
        <button class="btn ghost" id="dashClear" data-i18n="opt_dash_clear"></button>
      </div>
      <p class="row-hint" data-i18n="opt_dash_hint"></p>

      <div class="dash-figures">
        <div class="dash-figure">
          <span class="big-number" id="dashPeriod">0</span>
          <span class="row-hint" data-i18n="opt_dash_period"></span>
        </div>
        <div class="dash-figure">
          <span class="dash-today" id="dashToday">0</span>
          <span class="row-hint" data-i18n="opt_dash_today"></span>
        </div>
        <span class="save-note" id="dashNote"></span>
      </div>

      <div class="dash-chart" id="dashChart"></div>
      <p class="dash-empty" id="dashEmpty" data-i18n="opt_dash_empty" hidden></p>

      <h3 class="dash-subtitle" id="dashTopTitle" data-i18n="opt_dash_top"></h3>
      <div id="dashTop"></div>

      <p class="compile-info" data-i18n="opt_dash_note"></p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="opt_focus"></h2>
        <button class="btn primary" id="focusOpen" data-i18n="focus_open"></button>
      </div>
      <!-- Le libellé dit « ralentit », jamais « empêche ». Une extension
           ne peut pas empêcher sa propre désactivation, et promettre un
           verrou se retournerait contre nous au premier contournement. -->
      <p class="row-hint" data-i18n="opt_focus_hint"></p>
      <div id="focusList"></div>
      <p class="dash-empty" id="focusEmpty" data-i18n="opt_focus_none" hidden></p>
    </section>

    <section class="card">
      <h2 data-i18n="opt_debug"></h2>
      <div class="row">
        <div class="row-text">
          <span class="row-title" data-i18n="opt_debug_enable"></span>
          <span class="row-hint" data-i18n="opt_debug_hint"></span>
        </div>
        <label class="switch">
          <input type="checkbox" id="debugToggle">
          <span class="slider"></span>
        </label>
      </div>
      <div class="actions">
        <button class="btn primary" id="debugCopy" data-i18n="opt_debug_copy"></button>
        <button class="btn" id="debugRefresh" data-i18n="opt_debug_refresh"></button>
        <button class="btn ghost" id="debugClear" data-i18n="opt_debug_clear"></button>
        <span class="save-note" id="debugNote"></span>
      </div>
      <textarea id="debugLog" spellcheck="false" rows="14" readonly></textarea>
    </section>

    <section class="card">
      <h2 data-i18n="opt_stats"></h2>
      <div class="stats-row">
        <span class="big-number" id="totalBlocked">0</span>
        <span class="row-hint" data-i18n="opt_stats_total"></span>
        <button class="btn ghost" id="resetStats" data-i18n="opt_stats_reset"></button>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="opt_lists"></h2>
        <button class="btn" id="updateBtn" data-i18n="update_lists"></button>
      </div>
      <p class="row-hint" data-i18n="opt_lists_hint"></p>
      <div id="listsContainer"></div>
      <p class="compile-info" id="compileInfo"></p>
    </section>

    <section class="card">
      <h2 data-i18n="opt_user_filters"></h2>
      <p class="row-hint" data-i18n="opt_user_filters_hint"></p>
      <textarea id="userFilters" spellcheck="false" rows="7"
                placeholder="||ads.example.com^&#10;example.com##.banner"></textarea>
      <div class="actions">
        <button class="btn primary" id="saveFilters" data-i18n="opt_save"></button>
        <span class="save-note" id="filtersSaved"></span>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="opt_whitelist"></h2>
      <p class="row-hint" data-i18n="opt_whitelist_hint"></p>
      <textarea id="whitelist" spellcheck="false" rows="5"
                placeholder="example.com"></textarea>
      <div class="actions">
        <button class="btn primary" id="saveWhitelist" data-i18n="opt_save"></button>
        <span class="save-note" id="whitelistSaved"></span>
      </div>
    </section>

    <footer class="about">
      <span data-i18n="opt_about"></span>
      <a class="src" href="https://github.com/sandprivacy/sandblock"
         target="_blank" rel="noopener noreferrer">github.com/sandprivacy/sandblock</a>
      <span id="version"></span>
    </footer>

  </div>
  <script src="../js/ui/i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
