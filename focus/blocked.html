<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SandBlock</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main class="stage">
    <svg class="mark" viewBox="0 0 96 96" aria-hidden="true">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#22d3ee"/>
          <stop offset="1" stop-color="#818cf8"/>
        </linearGradient>
      </defs>
      <path d="M48 4 L86 18 V46 C86 68 70 84 48 92 C26 84 10 68 10 46 V18 Z"
            fill="none" stroke="url(#lg)" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="48" cy="48" r="16" fill="none" stroke="url(#lg)" stroke-width="6"/>
      <line x1="37" y1="59" x2="59" y2="37" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/>
    </svg>

    <p class="host" id="host"></p>
    <h1 class="headline" data-i18n="focus_blocked"></h1>
    <p class="until" id="until"></p>
    <p class="rule" id="rule"></p>

    <button class="back ghost-wait" id="continue" hidden></button>
    <button class="back" id="back" data-i18n="focus_back"></button>
  </main>

  <script src="../js/ui/i18n.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
